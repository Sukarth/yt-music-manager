name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm install -g @expo/cli

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Use printf (not echo) to avoid newline/escape weirdness
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          test -s google-services.json

      - run: npx expo prebuild --platform android --clean

      - name: Restore keystore
        run: |
          mkdir -p android/app
          # Use printf (not echo) to avoid newline/escape weirdness
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Print keystore certificate SHA-1
        run: |
          # Helps confirm the decoded keystore matches Firebase/Google OAuth config
          keytool -list -v \
            -keystore android/app/release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            | grep -E "SHA1:|SHA-1:" || true

      - name: Configure signing
        run: |
          echo "" >> android/gradle.properties
          cat >> android/gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Print APK signing certificate SHA-1
        run: |
          APK_PATH=$(ls -1 android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -E "SHA-1|SHA1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Build release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-signed
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format -- --check
      - run: npx eslint . --ext .ts,.tsx --format json -o eslint-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 90
